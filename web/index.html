<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>七不思議討滅録（動作確認用）</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-family: sans-serif;
    font-size: 14px;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #rotate-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: #000;
    color: #eee;
    font-family: sans-serif;
    text-align: center;
    padding: 24px;
  }
  #rotate-overlay .icon {
    font-size: 40px;
    animation: rotate-hint 1.6s ease-in-out infinite;
  }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate-overlay { display: flex; }
    canvas { visibility: hidden; }
  }
</style>
</head>
<body>
<div id="loading">読み込み中...(初回は少し時間がかかります)</div>
<div id="rotate-overlay">
  <div class="icon">📱</div>
  <div>端末を横向きにしてください</div>
</div>
<script src="wasm_exec.js"></script>
<script>
  function tryLockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
  }
  window.addEventListener("load", tryLockLandscape);
  document.addEventListener("touchstart", tryLockLandscape, { once: true });

  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then((result) => {
    document.getElementById("loading").remove();
    go.run(result.instance);
  }).catch((err) => {
    document.getElementById("loading").textContent = "読み込みに失敗しました: " + err;
    console.error(err);
  });
</script>
</body>
</html>
