<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="七不思議討滅録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>七不思議討滅録</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  /* Ebitenはbodyの大きさを画面サイズとして使い、heightに100%をインラインで
     指定する。スマホのアドレスバーの出し入れに追従するよう、対応ブラウザでは
     実際に見えている高さ(dvh)で上書きする。 */
  @supports (height: 100dvh) {
    html, body { height: 100dvh !important; }
  }
  #loading {
    position: fixed;
    inset: 0;
    background: #000;
  }
  #loading-status {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ccc;
    font-family: sans-serif;
    font-size: 14px;
    text-align: center;
  }
  #loading-label {
    position: fixed;
    right: 16px;
    bottom: 14px;
    color: #ccc;
    font-family: sans-serif;
    font-size: 14px;
    letter-spacing: 0.5px;
    animation: loading-bounce 0.7s ease-in-out infinite;
  }
  #loading-dots {
    display: inline-block;
    width: 0;
    overflow: hidden;
    white-space: nowrap;
    vertical-align: bottom;
    animation: loading-dots 1.2s steps(4, end) infinite;
  }
  #loading-dots::after {
    content: "...";
  }
  @keyframes loading-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes loading-dots {
    from { width: 0; }
    to { width: 1.1em; }
  }
  canvas {
    display: block;
  }
  #rotate-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: #000;
    color: #eee;
    font-family: sans-serif;
    text-align: center;
    padding: 24px;
  }
  #rotate-overlay .icon {
    font-size: 40px;
    animation: rotate-hint 1.6s ease-in-out infinite;
  }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate-overlay { display: flex; }
    canvas { visibility: hidden; }
  }
</style>
</head>
<body>
<div id="loading">
  <div id="loading-status">読み込み中...(初回は少し時間がかかります)</div>
  <div id="loading-label">Loading<span id="loading-dots"></span></div>
</div>
<div id="rotate-overlay">
  <div class="icon">📱</div>
  <div>端末を横向きにしてください</div>
</div>
<script src="wasm_exec.js"></script>
<script>
  // フルスクリーンへの切り替え自体はゲーム側(Go)が最初のタップ/キー入力で
  // 行う。ここでは切り替わった後に効く設定だけをかける。
  function onFullscreenChange() {
    const fs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fs) {
      return;
    }
    // 横向き固定はフルスクリーン中(またはホーム画面から起動したアプリ)でしか効かない。
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
    // Chrome/Edge: Escの単押しでフルスクリーンが解除されないようにする
    // (Escはゲームのキャンセルに使うため)。解除はEsc長押しになる。
    if (navigator.keyboard && navigator.keyboard.lock) {
      navigator.keyboard.lock(["Escape"]).catch(() => {});
    }
  }
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);

  // ホーム画面から起動したアプリ(PWA)はフルスクリーンAPIを使わなくても
  // 全画面なので、起動時に横向き固定だけ試す。
  if (window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches &&
      screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("landscape").catch(() => {});
  }

  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then((result) => {
    document.getElementById("loading").remove();
    go.run(result.instance);
  }).catch((err) => {
    document.getElementById("loading-status").textContent = "読み込みに失敗しました: " + err;
    console.error(err);
  });
</script>
</body>
</html>
